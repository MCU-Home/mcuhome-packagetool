---
# SPDX-FileCopyrightText: 2026 The MCUHome Contributors
# SPDX-License-Identifier: Apache-2.0
#
# Defaults for the registry_web role. See README.md next to this file for
# what the role does with them.

# Where the registry is mounted. Shared with every other registry role,
# so it deliberately carries no role prefix; all of them have to be given
# the same value, and one name for it is the point.
registry_root: /srv/registry  # noqa: var-naming[no-role-prefix]

# The image the web server runs from. A floating tag is pulled once and
# then kept: nothing here pulls again on its own, so a running server does
# not change version because a tag moved. Pin a digest
# (nginx@sha256:...) if you want that in writing.
registry_web_image: docker.io/library/nginx:stable-alpine

# The address the vhosts listen on. Nothing but the reverse proxy is
# meant to reach them, so the default is the loopback address.
registry_web_listen_address: "127.0.0.1"

# One port per vhost. The full tree, the bootstrap subset, and the dump
# distribution are separate servers rather than locations of one server:
# a request that reaches the wrong port then gets the wrong *server*,
# which serves a different tree, instead of slipping past a path rule.
registry_web_tree_port: 8080
registry_web_bootstrap_port: 8081
registry_web_mirror_sync_port: 8082

# Which of the three vhosts exist. A host that is only a mirror needs
# neither of the two extra ones.
registry_web_bootstrap_enabled: true
registry_web_mirror_sync_enabled: true

# Directory listings for the full tree. A registry is a plain file tree
# and listing it gives away nothing that is not already public, but a
# role does not switch that on for somebody else's server.
registry_web_autoindex: false

# How a listing looks. With this on, nginx emits its listing as XML and
# an XSLT stylesheet in the server turns it into a page — server-side, so
# a listing needs no JavaScript and loads nothing. It needs the xslt
# filter module in the image; the official nginx images ship it as a
# dynamic module, and an image without it needs this off.
registry_web_autoindex_xslt: true

# The stylesheet used for that. Empty means the one this role ships,
# rendered from templates/autoindex.xslt.j2 (see
# registry_web_autoindex_footer_html below); set it to a file of your own
# to render listings differently — that one is copied verbatim, with no
# templating applied.
registry_web_autoindex_stylesheet: ""

# Extra footer content on a rendered directory listing, inserted right
# after the "This mirror" link that is always there. Raw HTML, appended
# as-is (no escaping) — it is meant for a link or two, not for arbitrary
# markup from an untrusted source. Empty means the footer has nothing
# beyond that one link: a generic deployment has no opinion on what else
# belongs there. Only applies to the shipped stylesheet; a stylesheet
# named by registry_web_autoindex_stylesheet decides its own footer.
registry_web_autoindex_footer_html: ""

# Where the xslt filter module is, as nginx resolves it: relative to the
# configuration prefix, which is /etc/nginx in the official images.
registry_web_xslt_module: modules/ngx_http_xslt_filter_module.so

# The page served at exactly "/" on the full-tree vhost, as a path on the
# machine running Ansible. It is installed beside the configuration and
# is deliberately NOT part of the registry tree: a mirror copies the
# tree, and a page belongs to the host that serves it. Empty means "/"
# is answered like any other directory — a listing, or a 404 with
# listings off.
registry_web_tree_index_page: ""

# The page served at exactly "/" on the bootstrap vhost, same rules. A
# bootstrap host answers with signed documents, so this is the one place
# a browser has anything to look at. Empty means 404 (or a redirect, see
# below).
registry_web_bootstrap_page: ""

# What the bootstrap vhost answers at "/" when it serves no page of its
# own. Empty means 404, which is the honest answer for a host that serves
# documents. Set it to a URL to redirect a browser to a mirror instead.
# Ignored when registry_web_bootstrap_page is set — the two are two
# answers to one question, and the role refuses both at once.
registry_web_bootstrap_redirect: ""

# Whether the JSON documents of the full tree may be read by a browser
# from another host, and by which one. A mirror needs this: the pages
# live on the bootstrap host and the data on the mirrors, so the page's
# requests are cross-origin. "*" is the right value for a public registry
# — every one of those documents is fetchable with curl by anyone — and
# empty switches the header off. It is never set on the bootstrap vhost,
# whose documents the page reads from its own origin.
registry_web_cors_origin: ""

# Cache lifetimes. The long one is for files that can never change under
# their name — package files, content-named index parts, archived key
# sets; the short one is the fallback for everything the rules below do
# not name. The signed head documents are always revalidated instead.
registry_web_immutable_max_age: 31536000
registry_web_default_max_age: 300

# Where the generated configuration goes on the host.
registry_web_config_dir: /etc/packagetool
registry_web_config_path: /etc/packagetool/nginx.conf

# Where the files the web server serves from outside the tree go: the two
# pages and the listing stylesheet. A directory of its own, because it is
# bind-mounted into the container and the configuration directory holds
# the publisher keys' directory beside it.
registry_web_assets_dir: /etc/packagetool/web

# The systemd unit and the container it runs.
registry_web_service: packagetool-web
registry_web_container: packagetool-web

# Check the generated configuration with the image's own nginx before it
# is written. Costs one container start per run and is the difference
# between a broken file on disk and a run that stops with the error.
registry_web_validate_config: true

# The docker client. A full path, because systemd units need one.
registry_web_docker: /usr/bin/docker
registry_web_docker_service: docker.service
