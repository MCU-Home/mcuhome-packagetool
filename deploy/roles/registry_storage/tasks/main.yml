#
# Storage layout for a packagetool registry: a btrfs filesystem on a
# dedicated block device, one subvolume that carries the registry, and
# the tree inside it that the publish mechanics and the servers expect.
#
# The role is written so that it can be run again at any time. It creates
# a filesystem only on a device that carries nothing at all, and every
# step that could destroy data either checks first or is not done here.
#
# Check mode is not supported: on a device that has no filesystem yet,
# every step after the one that would create it has nothing to look at,
# so a dry run would report on check mode rather than on the server.

- name: Check the storage settings
  ansible.builtin.assert:
    that:
      - registry_storage_device | default('', true) | length > 0
      - registry_root | default('', true) is match('^/.+')
      - registry_storage_subvolume | default('', true) is match('^[^/]+$')
      - not (registry_storage_mount_options is search('subvol'))
      - registry_storage_sources | default([], true) is sequence
      - registry_storage_sources | default([], true) is not string
      - registry_storage_sources | default([], true) is not mapping
      - registry_storage_sources | default([], true)
        | reject('match', '^[A-Za-z0-9][A-Za-z0-9._-]*$') | list | length == 0
    fail_msg: >-
      registry_storage_device must name a block device, registry_root must
      be an absolute path, registry_storage_subvolume must be a plain name
      without a slash, registry_storage_mount_options must not contain a
      subvol option — the role adds that itself — registry_storage_sources
      must be a list of source names and not a plain string or a mapping
      (a string is itself a Jinja sequence and would be iterated character
      by character), and every entry of it must be a source name: letters,
      digits, dots, dashes and underscores, starting with a letter or a
      digit. Every one of them is a path segment of a public URL.
    quiet: true

- name: Prepare the filesystem
  ansible.builtin.include_tasks: filesystem.yml

- name: Look at what is mounted at the registry root
  ansible.builtin.include_tasks: mount-state.yml

- name: Create the registry subvolume
  ansible.builtin.include_tasks: subvolume.yml
  when: not registry_storage_mounted

- name: Mount the registry subvolume
  ansible.builtin.include_tasks: mount.yml

- name: Create the tree inside the registry subvolume
  ansible.builtin.include_tasks: layout.yml
