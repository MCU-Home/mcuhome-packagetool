#
# Defaults for the registry_storage role. See README.md next to this file
# for what the role does with them.

# The block device the registry filesystem lives on. Required — the role
# refuses to run without it. Use a stable name (/dev/disk/by-id/...), not
# a kernel name like /dev/sdb, which can change between boots.
registry_storage_device: ""

# Where the registry subvolume is mounted. This is the path everything
# else in a packagetool deployment refers to, so it deliberately carries
# no role prefix: the snapshot role, the web server and the rsync export
# all have to be given the same value, and one name for it is the point.
# Hence the exception from the linter's role-prefix rule.
registry_root: /srv/registry  # noqa: var-naming[no-role-prefix]

# Name of the subvolume that carries the registry. It is this subvolume
# that gets mounted, never the volume root, so the same volume can carry
# other subvolumes later on.
registry_storage_subvolume: "@registry"

# Filesystem label, used only when the role creates the filesystem.
registry_storage_label: registry

# The sources this registry carries, by name. Each one becomes a btrfs
# subvolume of its own under <root>/working, because a subvolume is what
# can be snapshotted, and publishing snapshots the sources that changed
# rather than the whole tree. Names have to match the sources the
# publishing configuration declares — they are the first path segment of
# every URL the registry serves.
#
# An empty list lays the tree down without any source. Creating a source
# needs keys that are deliberately not on a registry server, so this role
# creates the subvolume and nothing else; a subvolume with nothing in it
# is a source that has not been laid down yet, and every command here
# survives that.
#
# The role never removes a subvolume it does not find in this list: a
# source that has been published is not something a configuration run gets
# to delete.
registry_storage_sources: []

# Mount options for the registry subvolume. The subvol= option is added
# by the role and must not be listed here.
#
#   noatime         a read from a mirror or a client should not write
#   compress=zstd:3 the index documents compress well; btrfs
#                   skips data it finds incompressible, so the already
#                   compressed package files cost little
#   nodev,nosuid    nothing under the registry root is ever a device or
#                   a program to execute
#   nofail          a missing volume must not stop the server from
#                   booting: without it, systemd drops into emergency
#                   mode and there is no way in over the network
#   x-systemd.device-timeout
#                   how long boot waits for the device before nofail
#                   takes effect
registry_storage_mount_options: >-
  noatime,compress=zstd:3,nodev,nosuid,nofail,x-systemd.device-timeout=15s

# Owner and group of the registry tree. Root: the docroot symlink, the
# snapshot area and the dump area are switched, created and deleted by
# root, and nothing else needs to write there.
registry_storage_owner: root
registry_storage_group: root

# Owner and group of the working tree alone — the one part of the layout
# that something other than root writes to. Empty means the role leaves
# its ownership exactly as it finds it, which is what a deployment with a
# separate publishing account wants: that account is created by the role
# that installs the publish pipeline, so it cannot exist the first time
# this role runs, and two roles setting the same directory to two
# different owners would fight on every run. Set it only if this role is
# the one that should decide.
registry_storage_working_owner: ""
registry_storage_working_group: ""

# Whether the role may create a filesystem on a device that carries none.
# A device that carries anything at all — a filesystem, a partition
# table, an LVM or RAID signature — is never written to, whatever this is
# set to. Set it to false to refuse even an empty device, for instance
# when the filesystem is created outside Ansible.
registry_storage_format_if_empty: true

# Packages the role installs before it touches the device. Set to an
# empty list if package installation is managed elsewhere.
registry_storage_packages:
  - btrfs-progs
