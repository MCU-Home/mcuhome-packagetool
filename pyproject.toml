# This repository publishes no distribution: it is the package host
# (https://packages.mcuhome.org) plus the tooling that maintains it. The
# project table exists so the tooling and the reference verifier are
# importable in a virtual environment of this repository's own — the
# published artefacts are the JSON documents under sdk/, not a wheel.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuhome-packagetool"
version = "0.1.0"
description = "Publishing tooling and reference verifier for packages.mcuhome.org"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "cryptography>=42",
    "packaging>=23",
]

# PEP 735 dependency group, not a [project.optional-dependencies] extra:
# these tools are for working on this repository, never a runtime
# dependency of it, so they install standalone. Pinned to the versions
# every other MCUHome repository uses; bump here, CI follows.
[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff==0.16.1",
  "codespell==2.4.3",
  "reuse==5.0.2",
  "pre-commit-hooks==5.0.0",
]

[tool.setuptools]
packages = ["mcuhome.packagetool"]
# The reference verifier is a single top-level file on purpose (see its
# docstring): copyable next to a mirrored directory, importable here.
py-modules = ["verify"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

# The ignored words are deliberate spellings, not slips: Requestor and PASE
# are the Matter specification's own, OT is OpenThread, rsource is
# Kconfig's. Only .git is skipped: this repository holds no vendored or
# generated formats whose wording is not ours to correct. Moved here from
# the CI command line so scripts/lint.d/codespell can run the plain tool.
[tool.codespell]
ignore-words-list = "requestor,pase,ot,rsource,re-declared,re-declare,re-used,unparseable,pre-empt"
skip = "./.git"
