#
# Test gate: one job per wrapper in scripts/test.d/, plus a pre-check
# that every wrapper has a job here.
#
# test-pytest and test-catalog are offline: the fixed test vectors and
# the catalogue-regeneration check (sources.json against
# deploy/mcuhome/publishing.json). test-verify-sources is its own job
# because it needs network — the reference verifier and the
# remaining-validity report run against the *published* sources, so a
# broken signature or an expiring document fails here rather than in
# somebody's build.
#
# test-registry-snapshot, test-registry-storage, test-mirror-sync and
# test-registry-publish exercise the deploy/ material against real
# filesystems: btrfs images on loop devices, and for the storage role a
# set of devices carrying the things it has to refuse to overwrite. The
# publish job also runs whole publish cycles against a stand-in forge on
# the loopback address, so it needs this repository installed as well.
# All four need root and are therefore invoked through sudo — the
# wrappers themselves refuse to run without it rather than reporting a
# pass they did not earn.
#
# All actions are pinned to commit SHAs, not tags.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-gates:
    name: Check gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: scripts/test check-ci
        run: scripts/test check-ci

  test-pytest:
    name: Test (pytest)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check -e . --group dev

      - name: scripts/test pytest
        run: scripts/test pytest

  test-catalog:
    name: Test (catalog)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check -e . --group dev

      - name: scripts/test catalog
        run: scripts/test catalog

  test-verify-sources:
    name: Test (verify-sources)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check -e . --group dev

      - name: scripts/test verify-sources
        run: scripts/test verify-sources

  test-registry-snapshot:
    name: Test (registry-snapshot)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install btrfs-progs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs

      - name: scripts/test registry-snapshot
        run: sudo scripts/test registry-snapshot

  test-registry-storage:
    name: Test (registry-storage)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check -e . --group dev

      - name: Install the filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            btrfs-progs e2fsprogs lvm2 fdisk

      - name: scripts/test registry-storage
        run: sudo scripts/test registry-storage

  test-mirror-sync:
    name: Test (mirror-sync)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install btrfs-progs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs

      - name: scripts/test mirror-sync
        run: sudo scripts/test mirror-sync

  test-registry-publish:
    name: Test (registry-publish)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check -e . --group dev

      # packagetool-publish drops privileges via setpriv, and the unprivileged
      # user then has to traverse down to the venv; runner home directories
      # are 0750, unlike production (/opt) and local checkouts, which are
      # world-traversable already, so this fix-up is CI-only.
      - name: Make workspace traversable for the dropped-privilege publish user
        run: |
          sudo chmod o+x /home/runner /home/runner/work "$(dirname "$GITHUB_WORKSPACE")"
          sudo chmod -R o+rX "$GITHUB_WORKSPACE"

      - name: Install btrfs-progs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs

      # The wrapper hands the test this repository's own .venv, so sudo
      # may drop the rest of the environment as it likes.
      - name: scripts/test registry-publish
        run: sudo scripts/test registry-publish
